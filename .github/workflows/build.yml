name: Build Monorepo

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # We removed 'cache: pnpm' so it won't fail when pnpm-lock.yaml is missing

      - name: Install Dependencies
        run: pnpm install

      - name: Build Monorepo
        run: pnpm build

      - name: Test Protocol Gateway
        run: pnpm --filter @prismlink/protocol-gateway start
