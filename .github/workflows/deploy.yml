name: PrismLink Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  verify-and-build:
    name: Typecheck, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup pnpm Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.0

      - name: Setup Node.js Execution Engine
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Typecheck Across Workspaces
        run: pnpm --filter "..." exec tsc --noEmit

      - name: Build All Monorepo Targets
        run: pnpm build

      - name: Execute Gateway Runtime Verification
        run: pnpm --filter @prismlink/protocol-gateway start
