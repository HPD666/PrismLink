<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrismLink Utility Protocol</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 2rem;
      border-radius: 12px;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .status {
      color: #4ade80;
      font-weight: bold;
    }
    code {
      background: #020617;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>PrismLink Control Plane</h1>
    <p>Status: <span class="status">● Active</span></p>
    <p>Engine: <code>Kyber-1024 Post-Quantum Mesh</code></p>
    <hr style="border-color: #334155; margin: 1.5rem 0;" />
    <p>Repository configured successfully in monorepo architecture.</p>
  </div>
</body>
</html>
